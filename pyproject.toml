[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "deepstream-decode"
dynamic = ["version"]
description = "GPU-resident video decode via NVIDIA DeepStream — single-wheel install bundles the DS shared libs in a flat _libs/ directory and sets GST_PLUGIN_PATH + LIBV4L2_PLUGIN_DIR on import."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Viranjan Pagar", email = "vpagar@nvidia.com" },
]
keywords = ["deepstream", "nvdec", "video", "gpu", "gstreamer", "vllm", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
]

# No Python runtime dependencies. Container metadata (frame_count, fps,
# duration) is probed by the consumer — vLLM uses PyAV — so the former
# pymediainfo/libmediainfo dependency is no longer needed. System deps
# (GStreamer, PyGObject, libv4l) come from apt; see README.md.
dependencies = []

# No optional pip extras — system deps (GStreamer, PyGObject, libv4l)
# come from apt, see README.md "Install (consumer side)".

[project.scripts]
deepstream-decode-selftest = "deepstream_decode._selftest:main"

[tool.hatch.version]
path = "src/deepstream_decode/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deepstream_decode"]

# Force-include the bundled .so files. Without this, hatchling excludes
# binary data by default.
[tool.hatch.build.targets.wheel.force-include]
"src/deepstream_decode/_libs" = "deepstream_decode/_libs"
